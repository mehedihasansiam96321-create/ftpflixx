name: Build FTPFlix APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Generate Android project
        run: |
          set -e
          test -f ftpflix.html || { echo "Upload ftpflix.html to the repo root"; exit 1; }
          P=android
          mkdir -p $P/app/src/main/assets $P/app/src/main/java/com/ftpflix
          cd $P
          cat > settings.gradle.kts <<'E'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name="FTPFlix"
          include(":app")
          E
          cat > build.gradle.kts <<'E'
          plugins{
           id("com.android.application") version "8.5.2" apply false
           id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          E
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n' > gradle.properties
          cat > app/build.gradle.kts <<'E'
          plugins{id("com.android.application");id("org.jetbrains.kotlin.android")}
          android{
           namespace="com.ftpflix";compileSdk=34
           defaultConfig{applicationId="com.ftpflix";minSdk=21;targetSdk=34;versionCode=1;versionName="1.0"}
           compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17}
           kotlinOptions{jvmTarget="17"}
          }
          dependencies{
           implementation("androidx.appcompat:appcompat:1.6.1")
           implementation("androidx.media3:media3-exoplayer:1.4.1")
           implementation("androidx.media3:media3-ui:1.4.1")
           implementation("androidx.webkit:webkit:1.11.0")
          }
          E
          cat > app/src/main/AndroidManifest.xml <<'E'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <uses-permission android:name="android.permission.INTERNET"/>
           <uses-feature android:name="android.software.leanback" android:required="false"/>
           <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
           <application android:label="FTPFlix" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.NoActionBar">
            <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
             <intent-filter><action android:name="android.intent.action.MAIN"/>
              <category android:name="android.intent.category.LAUNCHER"/>
              <category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter>
            </activity>
            <activity android:name=".PlayerActivity" android:exported="false" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"/>
           </application>
          </manifest>
          E
          cat > app/src/main/java/com/ftpflix/MainActivity.kt <<'E'
          package com.ftpflix
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.os.Bundle
          import android.webkit.*
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.webkit.WebViewAssetLoader
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : AppCompatActivity() {
            private lateinit var web: WebView
            @SuppressLint("SetJavaScriptEnabled")
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val loader = WebViewAssetLoader.Builder().addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this)).build()
              web = WebView(this).apply {
                settings.javaScriptEnabled = true; settings.domStorageEnabled = true
                settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                addJavascriptInterface(Bridge(), "Native")
                webViewClient = object : WebViewClient() {
                  override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest): WebResourceResponse? {
                    val u = r.url
                    if (u.host == "appassets.androidplatform.net") return loader.shouldInterceptRequest(u)
                    if (r.method != "GET") return null
                    return try {
                      val c = URL(u.toString()).openConnection() as HttpURLConnection
                      c.connectTimeout = 10000; c.readTimeout = 20000; c.instanceFollowRedirects = true
                      val type = (c.contentType ?: "text/html").substringBefore(";")
                      WebResourceResponse(type, "utf-8", c.responseCode, "OK", mapOf("Access-Control-Allow-Origin" to "*"),
                        if (c.responseCode < 400) c.inputStream else c.errorStream)
                    } catch (e: Exception) { null }
                  }
                }
              }
              setContentView(web)
              web.loadUrl("https://appassets.androidplatform.net/assets/index.html")
              onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                override fun handleOnBackPressed() {
                  web.evaluateJavascript("view") { v ->
                    if (v == "\"home\"") finish()
                    else web.evaluateJavascript("document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}))", null)
                  }
                }
              })
            }
            inner class Bridge {
              @JavascriptInterface fun play(url: String, name: String) {
                startActivity(Intent(this@MainActivity, PlayerActivity::class.java).putExtra("u", url).putExtra("n", name))
              }
            }
          }
          E
          cat > app/src/main/java/com/ftpflix/PlayerActivity.kt <<'E'
          package com.ftpflix
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView

          class PlayerActivity : AppCompatActivity() {
            private var p: ExoPlayer? = null
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val pv = PlayerView(this).apply { keepScreenOn = true }
              setContentView(pv)
              val rf = DefaultRenderersFactory(this).setEnableDecoderFallback(true)
              p = ExoPlayer.Builder(this, rf).build().also {
                pv.player = it
                it.setMediaItem(MediaItem.Builder().setUri(intent.getStringExtra("u")!!)
                  .setMediaMetadata(MediaMetadata.Builder().setTitle(intent.getStringExtra("n")).build()).build())
                it.prepare(); it.play()
              }
            }
            override fun onStop() { super.onStop(); p?.pause() }
            override fun onDestroy() { super.onDestroy(); p?.release() }
          }
          E
          python3 - <<'E'
          s=open('../ftpflix.html',encoding='utf-8').read()
          a="async function play(url,name){"
          assert a in s
          s=s.replace(a,a+"if(window.Native){Native.play(url,name);return}",1)
          open('app/src/main/assets/index.html','w',encoding='utf-8').write(s)
          E
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Publish APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FTPFlix.apk
          gh release create "v${{ github.run_number }}" FTPFlix.apk --title "FTPFlix v${{ github.run_number }}" --notes "Download FTPFlix.apk below and install it on your phone or Android TV."
